_base_: base.yaml
run_name: stage1_roco
data:
  dataset: roco
  max_samples: 3000
  val_max_samples: 200
model:
  use_latent_prompt: false
  contrastive_mode: dcl
  lam: 0.5
  sam:
    enabled: true
train:
  stage: 1
  epochs: 1
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  select_metric: val_loss

